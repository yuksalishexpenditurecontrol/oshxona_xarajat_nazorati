<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Ovqat nazorati</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;

      background: var(--tg-theme-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #222);
    }

    .app {
      width: 100%;
      max-width: 650px;
      margin: auto;

      padding: 16px;
      padding-bottom: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header-icon {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .header h1 {
      margin: 0;

      font-size: 23px;
      font-weight: 700;
    }

    .header p {
      margin: 7px 0 0;

      font-size: 14px;
      opacity: 0.65;
    }

    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);

      border-radius: 16px;

      padding: 16px;

      margin-bottom: 14px;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;

      margin-bottom: 14px;
    }

    label {
      display: block;

      font-size: 13px;
      font-weight: 600;

      margin-bottom: 7px;

      opacity: 0.8;
    }

    input,
    textarea,
    select {
      width: 100%;

      border: 0;
      outline: none;

      border-radius: 12px;

      padding: 13px;

      font-size: 16px;

      color: var(--tg-theme-text-color, #222);

      background: var(--tg-theme-bg-color, #f3f3f3);

      margin-bottom: 12px;
    }

    input[type="date"] {
      min-height: 48px;
    }

    input[type="number"] {
      min-height: 48px;
    }

    textarea {
      min-height: 90px;

      resize: vertical;
    }

    .employee-box {
      border: 1px solid rgba(128, 128, 128, 0.2);

      border-radius: 12px;

      padding: 10px;

      margin-bottom: 12px;

      max-height: 320px;

      overflow-y: auto;
    }

    .employee-row {
      display: flex !important;

      align-items: center;

      gap: 10px;

      padding: 10px 4px;

      margin: 0 !important;

      border-bottom: 1px solid rgba(128, 128, 128, 0.12);

      cursor: pointer;
    }

    .employee-row:last-child {
      border-bottom: 0;
    }

    .employee-row input {
      width: 22px !important;
      height: 22px !important;

      min-height: 22px;

      margin: 0 !important;

      flex-shrink: 0;
    }

    .employee-name {
      font-size: 15px;

      line-height: 1.3;
    }

    .employee-position {
      display: block;

      font-size: 12px;

      opacity: 0.55;

      margin-top: 3px;
    }

    .empty-message {
      text-align: center;

      opacity: 0.55;

      padding: 14px;

      font-size: 14px;
    }

    .money {
      position: relative;
    }

    .money input {
      padding-right: 60px;
    }

    .currency {
      position: absolute;

      right: 14px;
      top: 15px;

      font-size: 13px;

      opacity: 0.55;

      pointer-events: none;
    }

    .photo-area {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 8px;
    }

    .photo-button {
      width: 100%;

      min-height: 105px;

      border: 2px dashed rgba(128, 128, 128, 0.35);

      border-radius: 14px;

      background: transparent;

      color: inherit;

      font-size: 14px;

      cursor: pointer;
    }

    .photo-preview {
      position: relative;

      height: 105px;

      border-radius: 14px;

      overflow: hidden;

      background: #ddd;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .remove-photo {
      position: absolute;

      right: 5px;
      top: 5px;

      width: 28px;
      height: 28px;

      border: 0;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.7);

      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    .counter {
      font-size: 12px;

      opacity: 0.55;

      text-align: right;

      margin-top: -7px;

      margin-bottom: 10px;
    }

    .save-button {
      width: 100%;

      border: 0;

      border-radius: 15px;

      padding: 16px;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      background: var(--tg-theme-button-color, #2481cc);

      color: var(--tg-theme-button-text-color, #fff);
    }

    .save-button:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }

    .status {
      display: none;

      margin-top: 12px;

      padding: 13px;

      border-radius: 12px;

      text-align: center;

      font-size: 14px;

      line-height: 1.4;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: rgba(50, 180, 80, 0.12);
    }

    .status.error {
      background: rgba(220, 60, 60, 0.12);
    }

    .status.loading {
      background: rgba(36, 129, 204, 0.12);
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">

    <div class="header-icon">
      🍽️
    </div>

    <h1>
      Ovqat nazorati
    </h1>

    <p>
      Kunlik ovqat xarajatlarini kiritish
    </p>

  </div>


  <!-- SANA -->
  <div class="card">

    <div class="section-title">
      📅 Sana
    </div>

    <input
      type="date"
      id="sana"
    >

  </div>


  <!-- OSHXONA -->
  <div class="card">

    <div class="section-title">
      👨‍🍳 Oshxona
    </div>

    <label>
      Oshxonada ovqatlangan xodimlar
    </label>

    <div
      class="employee-box"
      id="oshxonaXodimlar"
    >

      <div class="empty-message">
        Xodimlar yuklanmoqda...
      </div>

    </div>


    <label>
      Oshxona mahsulotlari
    </label>

    <textarea
      id="oshxonaItems"
      placeholder="Masalan:
Guruch - 5 kg
Go‘sht - 3 kg
Sabzi - 2 kg"
    ></textarea>


    <label>
      Oshxona haftasi
    </label>

    <select id="oshxonaHafta">

      <option value="">
        Haftani tanlang
      </option>

      <option value="1-hafta">
        1-hafta
      </option>

      <option value="2-hafta">
        2-hafta
      </option>

      <option value="3-hafta">
        3-hafta
      </option>

      <option value="4-hafta">
        4-hafta
      </option>

      <option value="5-hafta">
        5-hafta
      </option>

    </select>

  </div>


  <!-- TASHQARI -->
  <div class="card">

    <div class="section-title">
      🍔 Tashqarida ovqat
    </div>

    <label>
      Tashqarida ovqatlangan xodimlar
    </label>

    <div
      class="employee-box"
      id="tashqariXodimlar"
    >

      <div class="empty-message">
        Xodimlar yuklanmoqda...
      </div>

    </div>


    <label>
      Tashqari summa
    </label>

    <div class="money">

      <input
        type="number"
        id="tashqariSumma"
        min="0"
        placeholder="0"
      >

      <span class="currency">
        so‘m
      </span>

    </div>

  </div>


  <!-- KECHKI -->
  <div class="card">

    <div class="section-title">
      🌙 Kechki ovqat
    </div>

    <label>
      Kechki ovqatlangan xodimlar
    </label>

    <div
      class="employee-box"
      id="kechkiXodimlar"
    >

      <div class="empty-message">
        Xodimlar yuklanmoqda...
      </div>

    </div>


    <label>
      Kechki summa
    </label>

    <div class="money">

      <input
        type="number"
        id="kechkiSumma"
        min="0"
        placeholder="0"
      >

      <span class="currency">
        so‘m
      </span>

    </div>

  </div>


  <!-- RASMLAR -->
  <div class="card">

    <div class="section-title">
      📷 Rasmlar
    </div>

    <div class="counter">
      1–3 ta rasm yuklash mumkin
    </div>

    <div
      class="photo-area"
      id="photoArea"
    >

      <button
        type="button"
        class="photo-button"
        onclick="openPhotoPicker()"
      >
        ➕
        <br>
        Rasm qo‘shish
      </button>

    </div>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      capture="environment"
      multiple
      style="display:none"
    >

  </div>


  <!-- IZOH -->
  <div class="card">

    <div class="section-title">
      📝 Izoh
    </div>

    <textarea
      id="izoh"
      placeholder="Qo‘shimcha izoh..."
    ></textarea>

  </div>


  <!-- SAQLASH -->
  <button
    class="save-button"
    id="saveButton"
    onclick="saveData()"
  >
    💾 SAQLASH
  </button>


  <div
    class="status"
    id="status"
  ></div>

</div>


<script>

  /*
  ============================================================
  TELEGRAM
  ============================================================
  */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;


  if (tg) {

    tg.ready();

    tg.expand();

    tg.enableClosingConfirmation();

  }


  /*
  ============================================================
  GOOGLE APPS SCRIPT BACKEND
  ============================================================

  MUHIM:

  BU YERGA O'ZINGIZNING /exec URL'ingizni QO'YING.

  Masalan:

  https://script.google.com/macros/s/XXXXXXXX/exec

  ============================================================
  */

  const BACKEND_URL =
    "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTACBLQUJjVEsjrvYXUEIwxQfyUkEt25T8EO3OgSWvn3ehe7CmTgR_aG8s6ZLhvwKLZi_5zbgUZt8-E4nOPePkjdjlXvaXvmx_0gjy0cuJHUqlGcC44Jjfbnicyl93oRvEB8bPTyP6capAU_u2RHSufX1rFEeleWBqEaHolS7uloy54GYYz1aRWDtFOBPxJLhtoUuG3c8q1PhSFfo4Ot8nCPV4nSBrRZyPVfLzxNdBJaBNimxbmJ4DEsRON7Ot13FIRacyz2uGKrslU_OwlLwgwhrnE2A&lib=MNFdXjuTWO-v0jQgDA_XBK2qlBgYheUt-";


  /*
  ============================================================
  SANA
  ============================================================
  */

  function setToday() {

    const now =
      new Date();


    const year =
      now.getFullYear();


    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");


    const day =
      String(
        now.getDate()
      ).padStart(2, "0");


    document.getElementById(
      "sana"
    ).value =
      `${year}-${month}-${day}`;

  }


  /*
  ============================================================
  HOZIRCHA TEST XODIMLAR
  ============================================================

  KEYINGI BOSQICHDA BULAR GOOGLE SHEET'DAN
  AVTOMATIK KELADI.

  ============================================================
  */

  const employees = [

    {
      id: "001",
      fio: "Xodim 1",
      lavozim: "Lavozim"
    },

    {
      id: "002",
      fio: "Xodim 2",
      lavozim: "Lavozim"
    },

    {
      id: "003",
      fio: "Xodim 3",
      lavozim: "Lavozim"
    },

    {
      id: "004",
      fio: "Xodim 4",
      lavozim: "Lavozim"
    },

    {
      id: "005",
      fio: "Xodim 5",
      lavozim: "Lavozim"
    }

  ];


  /*
  ============================================================
  XODIMLARNI CHIQARISH
  ============================================================
  */

  function renderEmployees() {

    const boxes = [

      "oshxonaXodimlar",

      "tashqariXodimlar",

      "kechkiXodimlar"

    ];


    boxes.forEach(
      function(boxId) {

        const box =
          document.getElementById(
            boxId
          );


        box.innerHTML = "";


        if (
          !employees ||
          employees.length === 0
        ) {

          box.innerHTML = `
            <div class="empty-message">
              Xodimlar topilmadi
            </div>
          `;

          return;

        }


        employees.forEach(
          function(employee) {

            const row =
              document.createElement(
                "label"
              );


            row.className =
              "employee-row";


            row.innerHTML = `

              <input
                type="checkbox"
                value="${escapeHtml(employee.id)}"
                data-fio="${escapeHtml(employee.fio)}"
                data-lavozim="${escapeHtml(employee.lavozim)}"
              >

              <span class="employee-name">

                ${escapeHtml(employee.fio)}

                <span class="employee-position">
                  ${escapeHtml(employee.lavozim)}
                </span>

              </span>

            `;


            box.appendChild(row);

          }
        );

      }
    );

  }


  /*
  ============================================================
  HTML XAVFSIZLIGI
  ============================================================
  */

  function escapeHtml(text) {

    return String(text)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
  ============================================================
  RASMLAR
  ============================================================
  */

  let selectedPhotos = [];


  function openPhotoPicker() {

    document
      .getElementById("photoInput")
      .click();

  }


  document
    .getElementById("photoInput")
    .addEventListener(
      "change",
      function(event) {

        const files =
          Array.from(
            event.target.files
          );


        if (
          selectedPhotos.length +
          files.length >
          3
        ) {

          showStatus(
            "❌ Ko‘pi bilan 3 ta rasm yuklash mumkin.",
            "error"
          );

          this.value = "";

          return;

        }


        files.forEach(
          function(file) {

            if (
              !file.type.startsWith(
                "image/"
              )
            ) {

              return;

            }


            selectedPhotos.push(
              file
            );

          }
        );


        renderPhotos();


        this.value = "";

      }
    );


  function renderPhotos() {

    const area =
      document.getElementById(
        "photoArea"
      );


    area.innerHTML = "";


    selectedPhotos.forEach(
      function(file, index) {

        const box =
          document.createElement(
            "div"
          );


        box.className =
          "photo-preview";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          URL.createObjectURL(
            file
          );


        const remove =
          document.createElement(
            "button"
          );


        remove.type =
          "button";


        remove.className =
          "remove-photo";


        remove.innerHTML =
          "×";


        remove.onclick =
          function() {

            selectedPhotos.splice(
              index,
              1
            );


            renderPhotos();

          };


        box.appendChild(
          img
        );


        box.appendChild(
          remove
        );


        area.appendChild(
          box
        );

      }
    );


    if (
      selectedPhotos.length <
      3
    ) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "photo-button";


      button.innerHTML =
        "➕<br>Rasm qo‘shish";


      button.onclick =
        openPhotoPicker;


      area.appendChild(
        button
      );

    }

  }


  /*
  ============================================================
  TANLANGAN XODIMLAR
  ============================================================
  */

  function getSelectedEmployees(
    boxId
  ) {

    const box =
      document.getElementById(
        boxId
      );


    const checkboxes =
      box.querySelectorAll(
        'input[type="checkbox"]:checked'
      );


    return Array
      .from(checkboxes)
      .map(
        function(cb) {

          return {

            id:
              cb.value,

            fio:
              cb.dataset.fio,

            lavozim:
              cb.dataset.lavozim

          };

        }
      );

  }


  /*
  ============================================================
  FORM DATA
  ============================================================
  */

  function collectData() {

    return {

      sana:
        document
          .getElementById(
            "sana"
          )
          .value,


      oshxonaXodimlar:
        getSelectedEmployees(
          "oshxonaXodimlar"
        ),


      oshxonaItems:
        document
          .getElementById(
            "oshxonaItems"
          )
          .value
          .trim(),


      oshxonaHafta:
        document
          .getElementById(
            "oshxonaHafta"
          )
          .value,


      tashqariXodimlar:
        getSelectedEmployees(
          "tashqariXodimlar"
        ),


      tashqariSumma:
        Number(
          document
            .getElementById(
              "tashqariSumma"
            )
            .value || 0
        ),


      kechkiXodimlar:
        getSelectedEmployees(
          "kechkiXodimlar"
        ),


      kechkiSumma:
        Number(
          document
            .getElementById(
              "kechkiSumma"
            )
            .value || 0
        ),


      izoh:
        document
          .getElementById(
            "izoh"
          )
          .value
          .trim()

    };

  }


  /*
  ============================================================
  VALIDATSIYA
  ============================================================
  */

  function validateData(data) {

    if (!data.sana) {

      return "❌ Sanani kiriting.";

    }


    const hasEmployees =
      data.oshxonaXodimlar.length > 0 ||
      data.tashqariXodimlar.length > 0 ||
      data.kechkiXodimlar.length > 0;


    const hasMoney =
      data.tashqariSumma > 0 ||
      data.kechkiSumma > 0;


    const hasItems =
      data.oshxonaItems.length > 0;


    if (
      !hasEmployees &&
      !hasMoney &&
      !hasItems
    ) {

      return "❌ Hech qanday ma’lumot kiritilmadi.";

    }


    if (
      data.tashqariSumma > 0 &&
      data.tashqariXodimlar.length === 0
    ) {

      return "❌ Tashqari summa bor, lekin xodim tanlanmagan.";

    }


    if (
      data.kechkiSumma > 0 &&
      data.kechkiXodimlar.length === 0
    ) {

      return "❌ Kechki summa bor, lekin xodim tanlanmagan.";

    }


    if (
      data.oshxonaItems &&
      !data.oshxonaHafta
    ) {

      return "❌ Oshxona mahsulotlari kiritilgan. Haftani tanlang.";

    }


    return null;

  }


  /*
  ============================================================
  SAQLASH
  ============================================================
  */

  async function saveData() {

    const data =
      collectData();


    const validationError =
      validateData(
        data
      );


    if (validationError) {

      showStatus(
        validationError,
        "error"
      );

      return;

    }


    if (
      !BACKEND_URL ||
      BACKEND_URL.includes(
        "BU_YERGA"
      )
    ) {

      showStatus(
        "❌ Apps Script URL hali kiritilmagan.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "saveButton"
      );


    button.disabled =
      true;


    button.innerHTML =
      "⏳ Saqlanmoqda...";


    showStatus(
      "⏳ Ma’lumot serverga yuborilmoqda...",
      "loading"
    );


    /*
    ==========================================================
    TELEGRAM FOYDALANUVCHISI
    ==========================================================
    */

    let telegramUser = null;


    if (
      tg &&
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user
    ) {

      telegramUser =
        tg.initDataUnsafe.user;

    }


    /*
    ==========================================================
    SERVERGA YUBORILADIGAN MA'LUMOT
    ==========================================================
    */

    const payload = {

      telegramUser:
        telegramUser,


      sana:
        data.sana,


      oshxonaXodimlar:
        data.oshxonaXodimlar,


      oshxonaItems:
        data.oshxonaItems,


      oshxonaHafta:
        data.oshxonaHafta,


      tashqariXodimlar:
        data.tashqariXodimlar,


      tashqariSumma:
        data.tashqariSumma,


      kechkiXodimlar:
        data.kechkiXodimlar,


      kechkiSumma:
        data.kechkiSumma,


      izoh:
        data.izoh

    };


    console.log(
      "YUBORILAYOTGAN DATA:",
      payload
    );


    try {

      const response =
        await fetch(
          BACKEND_URL,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      const result =
        await response.json();


      console.log(
        "SERVER JAVOBI:",
        result
      );


      if (
        !result.ok
      ) {

        throw new Error(
          result.error ||
          "Server xatosi"
        );

      }


      button.disabled =
        false;


      button.innerHTML =
        "💾 SAQLASH";


      showStatus(
        "✅ Ma’lumot muvaffaqiyatli saqlandi!",
        "success"
      );


      /*
      FORMNI TOZALASH
      */

      clearForm();


    } catch (error) {

      console.error(
        "SAQLASH XATOSI:",
        error
      );


      button.disabled =
        false;


      button.innerHTML =
        "💾 SAQLASH";


      showStatus(
        "❌ Saqlashda xatolik: " +
        error.message,
        "error"
      );

    }

  }


  /*
  ============================================================
  FORMNI TOZALASH
  ============================================================
  */

  function clearForm() {

    document
      .getElementById(
        "oshxonaItems"
      )
      .value = "";


    document
      .getElementById(
        "oshxonaHafta"
      )
      .value = "";


    document
      .getElementById(
        "tashqariSumma"
      )
      .value = "";


    document
      .getElementById(
        "kechkiSumma"
      )
      .value = "";


    document
      .getElementById(
        "izoh"
      )
      .value = "";


    const checkboxes =
      document.querySelectorAll(
        'input[type="checkbox"]'
      );


    checkboxes.forEach(
      function(cb) {

        cb.checked =
          false;

      }
    );


    selectedPhotos =
      [];


    renderPhotos();


    setToday();

  }


  /*
  ============================================================
  STATUS
  ============================================================
  */

  function showStatus(
    message,
    type
  ) {

    const status =
      document.getElementById(
        "status"
      );


    status.textContent =
      message;


    status.className =
      "status show " +
      type;


    if (
      type !== "loading"
    ) {

      setTimeout(
        function() {

          status.className =
            "status";

        },
        5000
      );

    }

  }


  /*
  ============================================================
  START
  ============================================================
  */

  setToday();

  renderEmployees();

  renderPhotos();

</script>

</body>
</html>
